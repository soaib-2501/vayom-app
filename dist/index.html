<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#040d22"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VAYOM</title>
<style>
:root{box-sizing:border-box;margin:0;padding:0;padding-top:0;padding-bottom:0;--bg:#040d22;--bg2:#0a2a5c;--ink:#eaf3ff;--mute:#8fb0e0;--acc:#2f8cff;--acc2:#9cd0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#040d22}}
:root[data-theme="dark"]{--bg:#040d22}
html{margin:0;padding:0;width:100%;height:100%;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;scroll-padding-top:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root,main{margin:0!important;padding:0!important;padding-top:0!important;padding-bottom:0!important;width:100%!important;min-height:100vh!important;min-height:100dvh!important}
body{margin:0;padding:0;width:100%;height:100%;min-height:100vh;min-height:100dvh;background:var(--bg);background-size:cover;background-position:center;color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.stage{position:relative;width:100%;height:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;
background:radial-gradient(90% 70% at 50% 38%,var(--bg2) 0%,#071a3d 45%,var(--bg) 100%);background-size:cover}
.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(140,190,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,190,255,.05) 1px,transparent 1px);background-size:56px 56px;
-webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hub{position:relative;width:min(88vw,540px);display:flex;justify-content:center;align-items:center}
.ring{position:absolute;left:50%;top:50%;width:120%;aspect-ratio:1;border:1px solid rgba(120,190,255,.3);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:ping 3s .3s cubic-bezier(.2,.6,.3,1) infinite}
.ring:nth-child(2){animation-delay:1.3s}.ring:nth-child(3){animation-delay:2.3s}
@keyframes ping{0%{opacity:.7;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.logo{position:relative;width:100%;filter:drop-shadow(0 0 16px rgba(47,140,255,.5))}
.logo svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 16px rgba(47,140,255,.5))}
.L{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;transform:translateY(16px) scale(.96);animation:up .6s cubic-bezier(.2,.7,.2,1) forwards}
.arch{fill:url(#ag);opacity:0;animation:fade .5s .55s forwards,pulse 1.6s 1s ease-in-out infinite alternate}
@keyframes up{to{opacity:1;transform:none}}
@keyframes pulse{to{filter:drop-shadow(0 0 8px #4aa3ff)}}
.tag{margin:18px 0 0;text-align:center;font-weight:500;color:#fff;font-size:clamp(9px,2.5vw,16px);letter-spacing:.05em;text-wrap:balance;text-shadow:0 1px 14px rgba(47,140,255,.7);opacity:0;animation:fade .6s .7s forwards}
.tag b{color:#9cd0ff;font-weight:700}
.stage{animation:sf .9s ease-out both}
@keyframes sf{from{opacity:0}}
.logo{animation:push 2s .35s cubic-bezier(.2,.6,.2,1) both}
@keyframes push{from{transform:scale(.9)}}
.ch{position:absolute;height:auto;opacity:0;filter:blur(9px);animation:lf 1.3s var(--d,.5s) cubic-bezier(.3,.6,.2,1) forwards}
.ch:nth-child(1){--d:.55s}.ch:nth-child(2){--d:.65s}.ch:nth-child(3){--d:.75s}.ch:nth-child(4){--d:.85s}.ch:nth-child(5){--d:.95s}
@keyframes lf{to{opacity:1;filter:blur(0)}}
.ch.ar{filter:none;animation:lo 1s 1.2s forwards,fl 1.4s 1.2s ease-out,gl 1.6s 2.6s ease-in-out infinite alternate}
@keyframes lo{to{opacity:1}}
@keyframes fl{0%{filter:brightness(1)}35%{filter:brightness(1.6) drop-shadow(0 0 22px #6ab7ff)}100%{filter:brightness(1)}}
.bloom{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1.3;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;background:radial-gradient(closest-side,rgba(80,165,255,.6),rgba(47,140,255,.16) 50%,transparent 76%);animation:bl 2.4s .3s ease-out forwards}
@keyframes bl{35%{opacity:1}to{opacity:.35;transform:translate(-50%,-50%) scale(1)}}
.ch.tg{--d:1.05s}
.hub{transform:translateY(-3vh)}
@keyframes gl{to{filter:drop-shadow(0 0 9px #4aa3ff)}}
.hud{position:relative;width:min(88vw,380px);margin-top:36px;opacity:0;animation:fade .5s .5s forwards}
@keyframes fade{to{opacity:1}}
.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#d6e6ff;margin-bottom:10px;font-variant-numeric:tabular-nums}
.track{height:2px;background:rgba(150,200,255,.18);position:relative}
.fill{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc)}
.fill:after{content:"";position:absolute;right:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px var(--acc2)}
.mods{display:flex;justify-content:space-between;margin-top:18px;font-size:12px;font-weight:600;letter-spacing:.08em;color:#86a6d8}
.mods span{display:flex;align-items:center;gap:7px;transition:color .4s}
.mods i{width:7px;height:7px;border-radius:50%;border:1px solid currentColor;transition:.4s}
.mods span.on{color:var(--ink)}.mods span.on i{background:var(--acc);border-color:var(--acc);box-shadow:0 0 8px var(--acc)}
.foot{position:absolute;bottom:18px;display:flex;gap:18px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.14em;color:#86a6d8;text-transform:uppercase}
.foot button{background:none;border:1px solid rgba(150,200,255,.3);color:var(--mute);padding:6px 14px;border-radius:16px;font:inherit;letter-spacing:.14em;cursor:pointer}
@media(max-width:480px){.hud{margin-top:30px}.meta,.mods,.foot{font-size:11px}.foot{gap:12px}.ring{width:150%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important!important}}
